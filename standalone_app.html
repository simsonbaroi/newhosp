<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Bill Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --background: 220 15% 6%;
            --foreground: 160 20% 95%;
            --card: 220 15% 8%;
            --primary: 160 60% 45%;
            --medical-gradient: linear-gradient(135deg, #064e3b, #10b981);
        }
        body {
            background-color: hsl(220, 15%, 6%);
            color: hsl(160, 20%, 95%);
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .glass-card {
            background: rgba(22, 25, 31, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(77, 166, 122, 0.2);
            border-radius: 0.75rem;
        }
        .medical-gradient {
            background: var(--medical-gradient);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- Mock Data ---
        const MEDICAL_ITEMS = [
            { id: 1, category: 'Laboratory', name: 'Complete Blood Count', price: 250, isOutpatient: true },
            { id: 2, category: 'Laboratory', name: 'Urinalysis', price: 150, isOutpatient: true },
            { id: 3, category: 'X-Ray', name: 'Chest X-Ray', price: 800, isOutpatient: true },
            { id: 4, category: 'Dr. Fees', name: 'General Consultation', price: 500, isOutpatient: true },
            { id: 5, category: 'Laboratory', name: 'Blood Chemistry', price: 500, isOutpatient: false },
            { id: 6, category: 'Surgery', name: 'Minor Surgery', price: 15000, isOutpatient: false },
        ];

        const CATEGORIES = [
            'Registration Fees', 'Dr. Fees', 'Medic Fee', 'Laboratory', 'X-Ray', 'Medicine', 'Physical Therapy'
        ];

        // --- Components ---
        const Icon = ({ name, className }) => {
            useEffect(() => {
                lucide.createIcons();
            }, []);
            return <i data-lucide={name} className={className}></i>;
        };

        const Button = ({ children, variant = 'primary', className = '', onClick }) => {
            const baseStyles = "px-4 py-2 rounded-md font-medium transition-all duration-200 flex items-center justify-center gap-2";
            const variants = {
                primary: "bg-emerald-600 hover:bg-emerald-700 text-white",
                outline: "border border-emerald-600 text-emerald-600 hover:bg-emerald-600/10",
                ghost: "hover:bg-white/10 text-white",
                medical: "bg-white text-emerald-800 hover:bg-emerald-50"
            };
            return (
                <button className={`${baseStyles} ${variants[variant]} ${className}`} onClick={onClick}>
                    {children}
                </button>
            );
        };

        const Card = ({ title, children, className = "" }) => (
            <div className={`glass-card p-6 ${className}`}>
                {title && <h3 className="text-xl font-bold mb-4">{title}</h3>}
                {children}
            </div>
        );

        // --- Pages ---
        const Dashboard = ({ onNavigate }) => (
            <div className="space-y-8">
                <div className="medical-gradient p-12 rounded-2xl text-center shadow-2xl">
                    <h1 className="text-4xl font-bold mb-4">Hospital Bill Calculator</h1>
                    <p className="text-emerald-100 max-w-2xl mx-auto mb-8">
                        Professional medical billing system for standalone use in Google AI Studio.
                    </p>
                    <Button variant="medical" onClick={() => onNavigate('outpatient')}>
                        Start Calculating <Icon name="arrow-right" className="w-4 h-4" />
                    </Button>
                </div>

                <div className="grid md:grid-cols-3 gap-6">
                    <Card title="Outpatient" className="text-center group hover:scale-105 cursor-pointer" onClick={() => onNavigate('outpatient')}>
                        <Icon name="users" className="w-12 h-12 mx-auto mb-4 text-emerald-500" />
                        <p className="text-gray-400 mb-6">Calculate bills for consultations, lab tests, and procedures.</p>
                        <Button className="w-full">Open</Button>
                    </Card>
                    <Card title="Inpatient" className="text-center group hover:scale-105 cursor-pointer" onClick={() => onNavigate('inpatient')}>
                        <Icon name="stethoscope" className="w-12 h-12 mx-auto mb-4 text-emerald-500" />
                        <p className="text-gray-400 mb-6">Manage room charges, surgery, and extended stay billing.</p>
                        <Button className="w-full">Open</Button>
                    </Card>
                    <Card title="Database" className="text-center group hover:scale-105 cursor-pointer" onClick={() => onNavigate('database')}>
                        <Icon name="database" className="w-12 h-12 mx-auto mb-4 text-emerald-500" />
                        <p className="text-gray-400 mb-6">Add and modify items, prices, and hospital categories.</p>
                        <Button className="w-full">Manage</Button>
                    </Card>
                </div>
            </div>
        );

        const CalculatorPage = ({ type, onNavigate }) => {
            const [billItems, setBillItems] = useState([]);
            const [searchQuery, setSearchQuery] = useState('');

            const filteredItems = MEDICAL_ITEMS.filter(item => 
                (type === 'outpatient' ? item.isOutpatient : !item.isOutpatient) &&
                item.name.toLowerCase().includes(searchQuery.toLowerCase())
            );

            const total = billItems.reduce((acc, item) => acc + item.price, 0);

            const addToBill = (item) => {
                setBillItems([...billItems, { ...item, billId: Date.now() }]);
            };

            return (
                <div className="grid md:grid-cols-3 gap-8">
                    <div className="md:col-span-2 space-y-6">
                        <Card title={`${type.charAt(0).toUpperCase() + type.slice(1)} Calculator`}>
                            <div className="relative mb-6">
                                <Icon name="search" className="absolute left-3 top-3 text-gray-500 w-4 h-4" />
                                <input 
                                    className="w-full bg-black/20 border border-emerald-900/30 rounded-md py-2 pl-10 pr-4 focus:outline-none focus:ring-2 focus:ring-emerald-500"
                                    placeholder="Search items..."
                                    value={searchQuery}
                                    onChange={(e) => setSearchQuery(e.target.value)}
                                />
                            </div>
                            <div className="space-y-2 max-h-[500px] overflow-y-auto pr-2">
                                {filteredItems.map(item => (
                                    <div key={item.id} className="flex justify-between items-center p-3 rounded-lg bg-white/5 border border-white/5 hover:border-emerald-500/30 transition-colors">
                                        <div>
                                            <div className="font-bold">{item.name}</div>
                                            <div className="text-sm text-gray-500">{item.category}</div>
                                        </div>
                                        <div className="flex items-center gap-4">
                                            <span className="font-mono text-emerald-400">৳{item.price}</span>
                                            <Button size="sm" onClick={() => addToBill(item)}>
                                                <Icon name="plus" className="w-4 h-4" />
                                            </Button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </Card>
                    </div>

                    <div>
                        <Card title="Current Bill">
                            <div className="space-y-4 mb-8 max-h-[400px] overflow-y-auto">
                                {billItems.map(item => (
                                    <div key={item.billId} className="flex justify-between text-sm border-b border-white/5 pb-2">
                                        <span>{item.name}</span>
                                        <span className="text-emerald-400 font-mono">৳{item.price}</span>
                                    </div>
                                ))}
                                {billItems.length === 0 && <div className="text-center text-gray-600">No items added</div>}
                            </div>
                            <div className="border-t border-emerald-500/30 pt-4">
                                <div className="flex justify-between items-center text-xl font-bold">
                                    <span>Total:</span>
                                    <span className="text-emerald-400 font-mono">৳{total}</span>
                                </div>
                                <Button className="w-full mt-6" variant="primary">Generate Invoice</Button>
                            </div>
                        </Card>
                    </div>
                </div>
            );
        };

        const Main = () => {
            const [page, setPage] = useState('dashboard');

            return (
                <div className="min-h-screen flex flex-col">
                    <header className="border-b border-emerald-900/30 bg-black/20 backdrop-blur-md sticky top-0 z-50">
                        <div className="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
                            <div className="flex items-center gap-3 cursor-pointer" onClick={() => setPage('dashboard')}>
                                <div className="bg-emerald-600 p-2 rounded-lg">
                                    <Icon name="calculator" className="text-white w-6 h-6" />
                                </div>
                                <span className="text-xl font-bold tracking-tight">MCH Billing</span>
                            </div>
                            <nav className="flex gap-4">
                                <Button variant="ghost" onClick={() => setPage('dashboard')}>Dashboard</Button>
                                <Button variant="ghost" onClick={() => setPage('database')}>Database</Button>
                                <Button variant="ghost" onClick={() => setPage('settings')}><Icon name="settings" className="w-4 h-4" /></Button>
                            </nav>
                        </div>
                    </header>

                    <main className="flex-1 max-w-7xl mx-auto w-full px-6 py-12">
                        {page === 'dashboard' && <Dashboard onNavigate={setPage} />}
                        {page === 'outpatient' && <CalculatorPage type="outpatient" onNavigate={setPage} />}
                        {page === 'inpatient' && <CalculatorPage type="inpatient" onNavigate={setPage} />}
                        {page === 'database' && (
                            <div className="text-center py-20">
                                <h2 className="text-2xl font-bold mb-4">Database Management</h2>
                                <p className="text-gray-400 mb-8">Management interface for hospital medical items.</p>
                                <Button variant="outline" onClick={() => setPage('dashboard')}>Back Home</Button>
                            </div>
                        )}
                        {page === 'settings' && (
                            <div className="text-center py-20">
                                <h2 className="text-2xl font-bold mb-4">App Settings</h2>
                                <p className="text-gray-400 mb-8">Customize app name, colors, and branding.</p>
                                <Button variant="outline" onClick={() => setPage('dashboard')}>Back Home</Button>
                            </div>
                        )}
                    </main>

                    <footer className="border-t border-emerald-900/30 py-8 text-center text-gray-600 text-sm">
                        &copy; 2026 MCH Hospital Billing System. All rights reserved.
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Main />);
    </script>
</body>
</html>
