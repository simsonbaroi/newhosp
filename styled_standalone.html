<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Hospital Bill Calculator - Styled Standalone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --background: 220 15% 6%;
            --foreground: 160 20% 95%;
            --card: 220 15% 8%;
            --card-foreground: 160 20% 95%;
            --primary: 160 60% 45%;
            --primary-foreground: 0 0% 100%;
            --secondary: 160 25% 15%;
            --secondary-foreground: 160 20% 85%;
            --muted: 220 15% 12%;
            --muted-foreground: 160 10% 65%;
            --accent: 160 60% 35%;
            --accent-foreground: 0 0% 100%;
            --border: 160 25% 20%;
            --input: 220 15% 10%;
            --ring: 160 60% 45%;
            --medical-primary: 160 60% 45%;
            --medical-gradient-start: 160 60% 30%;
            --medical-gradient-end: 160 65% 45%;
        }

        * {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        input, textarea, button, [contenteditable] {
            -webkit-user-select: text;
            user-select: text;
        }

        html {
            overflow-y: scroll;
        }

        body {
            background-color: hsl(220, 15%, 6%);
            color: hsl(160, 20%, 95%);
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overscroll-behavior: contain;
        }

        .header-enhanced {
            background: linear-gradient(135deg, hsl(160, 60%, 30%), hsl(160, 65%, 45%));
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .glass-card {
            background: rgba(22, 25, 31, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid hsl(160, 25%, 20%);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), 
                        0 4px 16px rgba(77, 166, 122, 0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            box-shadow: 0 16px 64px rgba(0, 0, 0, 0.5), 
                        0 8px 32px rgba(77, 166, 122, 0.15);
            border-color: rgba(16, 185, 129, 0.3);
            transform: translateY(-2px);
        }

        .glass-card-mobile {
            background: rgba(22, 25, 31, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid hsl(160, 25%, 20%);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        }

        .medical-gradient {
            background: linear-gradient(135deg, hsl(160, 60%, 30%), hsl(160, 65%, 45%));
        }

        .neo-shadow {
            box-shadow: 
                0 0 0 1px rgba(160, 237, 193, 0.05),
                0 4px 16px rgba(0, 0, 0, 0.2),
                0 8px 32px rgba(0, 0, 0, 0.15);
        }

        .ripple {
            position: relative;
            overflow: hidden;
        }

        .ripple::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 5px;
            height: 5px;
            background: rgba(255, 255, 255, 0.5);
            opacity: 0;
            border-radius: 100%;
            transform: scale(1);
            transform-origin: 50% 50%;
        }

        .ripple:active::after {
            animation: ripple-animation 0.6s ease-out;
        }

        @keyframes ripple-animation {
            to {
                transform: scale(40);
                opacity: 0;
            }
        }

        .float-in {
            animation: floatIn 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes floatIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .item-card-mobile {
            animation: slideInRight 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .badge-mobile {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            color: rgb(34, 197, 94);
        }

        .bill-drawer-mobile {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 50;
            animation: slideUpModal 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 24px 24px 0 0;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
        }

        @keyframes slideUpModal {
            from {
                opacity: 0;
                transform: translateY(100%);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .bill-total-highlight {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.1), rgba(16, 185, 129, 0.05));
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: hsl(160, 25%, 20%);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: hsl(160, 60%, 45%);
        }

        .mobile-nav-item {
            position: relative;
            padding: 0.875rem 1rem;
            margin: 0.25rem 0;
            border-radius: 0.875rem;
            font-weight: 500;
            transition: all 0.2s;
        }

        .mobile-nav-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 0;
            background: hsl(160, 60%, 45%);
            border-radius: 0 3px 3px 0;
            transition: height 0.2s;
        }

        .mobile-nav-item.active::before {
            height: 24px;
        }

        .cta-button-mobile {
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, rgb(16, 185, 129), rgb(6, 78, 59));
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .cta-button-mobile:active {
            transform: scale(0.98);
        }

        @media (max-width: 640px) {
            body {
                font-size: 16px;
            }
            .header-enhanced {
                padding: 0;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- Mock Data ---
        const MEDICAL_ITEMS = [
            { id: 1, category: 'Laboratory', name: 'Complete Blood Count', price: 250, icon: 'beaker' },
            { id: 2, category: 'Laboratory', name: 'Urinalysis', price: 150, icon: 'test-tubes' },
            { id: 3, category: 'X-Ray', name: 'Chest X-Ray', price: 800, icon: 'zap' },
            { id: 4, category: 'Dr. Fees', name: 'General Consultation', price: 500, icon: 'user-md' },
            { id: 5, category: 'Laboratory', name: 'Blood Chemistry', price: 500, icon: 'vial' },
            { id: 6, category: 'Surgery', name: 'Minor Surgery', price: 15000, icon: 'knife' },
            { id: 7, category: 'Registration', name: 'Registration', price: 100, icon: 'clipboard' },
            { id: 8, category: 'Room', name: 'Room Charge', price: 1000, icon: 'home' },
        ];

        // --- Shared Components ---
        const Icon = ({ name, className }) => {
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, []);
            return <i data-lucide={name} className={className}></i>;
        };

        const Button = ({ children, variant = 'primary', className = '', onClick, size = 'default', disabled = false }) => {
            const sizes = {
                default: "h-10 px-4 py-2 text-sm",
                sm: "h-9 px-3 rounded-lg text-xs",
                lg: "h-12 px-6 rounded-lg text-base font-semibold",
                icon: "h-10 w-10 min-h-[44px] min-w-[44px]",
                "icon-lg": "h-12 w-12 min-h-[48px] min-w-[48px]"
            };
            const variants = {
                primary: "bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white shadow-lg",
                outline: "border border-emerald-600/50 text-emerald-400 hover:bg-emerald-600/10 active:bg-emerald-600/20",
                ghost: "hover:bg-white/10 active:bg-white/20 text-white",
                medical: "bg-white text-emerald-800 hover:bg-emerald-50 active:bg-emerald-100 shadow-xl font-semibold",
                secondary: "bg-emerald-900/30 text-emerald-100 hover:bg-emerald-900/50 active:bg-emerald-900/70"
            };
            return (
                <button 
                    className={`inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-md font-medium transition-all focus-visible:outline-none disabled:pointer-events-none disabled:opacity-50 ripple ${sizes[size]} ${variants[variant]} ${className}`} 
                    onClick={onClick}
                    disabled={disabled}
                >
                    {children}
                </button>
            );
        };

        // --- Pages ---
        const IndexPage = ({ onNavigate }) => (
            <div className="min-h-screen">
                <div className="medical-gradient text-white py-10 sm:py-20 px-4 sm:px-6 relative overflow-hidden">
                    <div className="absolute inset-0 opacity-20">
                        <div className="absolute top-10 right-10 w-40 h-40 bg-white rounded-full blur-3xl"></div>
                        <div className="absolute bottom-10 left-10 w-40 h-40 bg-emerald-300 rounded-full blur-3xl"></div>
                    </div>
                    <div className="max-w-5xl mx-auto text-center relative z-10">
                        <div className="float-in flex justify-center mb-6 sm:mb-8">
                            <div className="p-4 sm:p-5 bg-white/20 rounded-full backdrop-blur-md border border-white/30">
                                <Icon name="heart-handshake" className="w-12 h-12 sm:w-16 sm:h-16 text-white" />
                            </div>
                        </div>
                        <h1 className="text-3xl sm:text-5xl font-bold mb-3 sm:mb-6 tracking-tight leading-tight">Hospital Bill Calculator</h1>
                        <p className="text-sm sm:text-lg text-emerald-50/80 mb-8 sm:mb-10 max-w-2xl mx-auto leading-relaxed">
                            Fast, accurate, and beautiful. Calculate medical bills with confidence.
                        </p>
                        <Button variant="medical" size="lg" onClick={() => onNavigate('outpatient')} className="font-bold cta-button-mobile shadow-2xl">
                            Get Started <Icon name="arrow-right" className="w-4 h-4 sm:w-5 sm:h-5 ml-2" />
                        </Button>
                    </div>
                </div>

                <div className="max-w-7xl mx-auto px-4 sm:px-6 py-10 sm:py-20 grid sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-8">
                    {[
                        { title: 'Outpatient', desc: 'Lab tests, x-rays, consultations', icon: 'users', action: 'outpatient' },
                        { title: 'Inpatient', desc: 'Admission, room charges, surgery', icon: 'stethoscope', action: 'inpatient' },
                        { title: 'Database', desc: 'Configure items and pricing', icon: 'database', action: 'database' },
                    ].map((item, i) => (
                        <div key={i} className="glass-card-mobile p-5 sm:p-8 rounded-2xl sm:rounded-3xl group cursor-pointer hover:scale-105 transition-transform duration-300" onClick={() => onNavigate(item.action)} style={{animation: `floatIn 0.5s ease-out ${i * 100}ms both`}}>
                            <div className="mb-5 sm:mb-6 p-3 sm:p-4 bg-emerald-900/40 rounded-2xl w-fit group-hover:scale-110 group-hover:bg-emerald-900/60 transition-all duration-300">
                                <Icon name={item.icon} className="w-7 h-7 sm:w-10 sm:h-10 text-emerald-300" />
                            </div>
                            <h3 className="text-lg sm:text-2xl font-bold mb-2 sm:mb-3">{item.title}</h3>
                            <p className="text-xs sm:text-base text-emerald-100/60 mb-5 sm:mb-8 leading-relaxed">{item.desc}</p>
                            <Button variant="primary" className="w-full text-xs sm:text-sm">
                                {item.action === 'database' ? 'Manage' : 'Open'}
                            </Button>
                        </div>
                    ))}
                </div>
            </div>
        );

        const CalculatorPage = ({ type, onNavigate }) => {
            const [billItems, setBillItems] = useState([]);
            const [search, setSearch] = useState('');
            const [showBillMobile, setShowBillMobile] = useState(false);

            const filtered = MEDICAL_ITEMS.filter(i => 
                i.name.toLowerCase().includes(search.toLowerCase())
            );

            const total = billItems.reduce((acc, i) => acc + i.price, 0);

            const BillContent = () => (
                <div className="space-y-4">
                    <div className="flex items-center gap-2 pb-4 border-b border-emerald-900/30">
                        <div className="p-2 bg-emerald-900/40 rounded-lg">
                            <Icon name="file-text" className="w-5 h-5 text-emerald-400" />
                        </div>
                        <h3 className="text-lg sm:text-xl font-bold">Current Bill</h3>
                    </div>
                    
                    <div className="space-y-2 max-h-[280px] sm:max-h-[400px] overflow-y-auto pr-2">
                        {billItems.map((item, idx) => (
                            <div key={item.billId} className="item-card-mobile flex justify-between items-center group bg-white/5 hover:bg-white/10 p-3 rounded-xl border border-emerald-900/20 hover:border-emerald-500/40 transition-all duration-200" style={{animationDelay: `${idx * 50}ms`}}>
                                <span className="text-sm font-medium truncate flex-1">{item.name}</span>
                                <div className="flex items-center gap-2 ml-2">
                                    <span className="text-emerald-400 font-mono font-bold text-sm whitespace-nowrap">৳{item.price}</span>
                                    <button 
                                        onClick={() => setBillItems(billItems.filter(i => i.billId !== item.billId))}
                                        className="text-red-500/50 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity p-1 hover:bg-red-500/10 rounded-lg"
                                    >
                                        <Icon name="trash-2" className="w-4 h-4" />
                                    </button>
                                </div>
                            </div>
                        ))}
                        {billItems.length === 0 && (
                            <div className="py-10 text-center flex flex-col items-center gap-3 opacity-30">
                                <Icon name="inbox" className="w-12 h-12" />
                                <p className="text-sm font-medium">Add items to get started</p>
                            </div>
                        )}
                    </div>

                    <div className="space-y-3 pt-4 border-t border-emerald-900/50">
                        <div className="flex justify-between items-center text-xs">
                            <span className="text-emerald-100/60 font-medium">Subtotal</span>
                            <span className="font-mono font-semibold">৳{total}</span>
                        </div>
                        <div className="bill-total-highlight rounded-xl p-4">
                            <div className="flex justify-between items-center">
                                <span className="text-lg font-bold">Total Amount</span>
                                <span className="text-2xl font-mono font-bold text-emerald-400">৳{total}</span>
                            </div>
                        </div>
                        <Button variant="primary" className="w-full h-12 text-sm font-semibold shadow-xl neo-shadow cta-button-mobile" onClick={() => alert('Invoice generated!')}>
                            <Icon name="print" className="w-4 h-4" /> Print Invoice
                        </Button>
                    </div>
                </div>
            );

            return (
                <div className="pb-24 sm:pb-0">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 py-6 sm:py-10 grid lg:grid-cols-3 gap-6 sm:gap-10">
                        <div className="lg:col-span-2 space-y-6 sm:space-y-8">
                            <div className="flex items-center justify-between">
                                <div className="flex items-center gap-2 sm:gap-3">
                                    <div className="p-2 sm:p-3 bg-emerald-900/40 rounded-lg sm:rounded-xl">
                                        <Icon name={type === 'outpatient' ? 'users' : 'stethoscope'} className="w-6 h-6 sm:w-8 sm:h-8 text-emerald-400" />
                                    </div>
                                    <h2 className="text-2xl sm:text-3xl font-bold">{type.charAt(0).toUpperCase() + type.slice(1)}</h2>
                                </div>
                                <Button variant="secondary" size="icon" className="lg:hidden rounded-xl border border-emerald-900/30" onClick={() => setShowBillMobile(true)}>
                                    <div className="relative">
                                        <Icon name="shopping-cart" className="w-5 h-5" />
                                        {billItems.length > 0 && <span className="absolute -top-2 -right-2 bg-emerald-500 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center font-bold">{billItems.length}</span>}
                                    </div>
                                </Button>
                            </div>

                            <div className="glass-card-mobile p-4 sm:p-6 rounded-2xl sm:rounded-3xl">
                                <div className="relative mb-5 sm:mb-6">
                                    <Icon name="search" className="absolute left-3 sm:left-4 top-3 sm:top-3.5 text-emerald-500/50 w-4 h-4 sm:w-5 sm:h-5" />
                                    <input 
                                        className="w-full bg-black/40 border border-emerald-900/50 rounded-xl py-3 pl-10 sm:pl-12 pr-4 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition-all placeholder:text-emerald-900/50 text-sm"
                                        placeholder={`Search medical items...`}
                                        value={search}
                                        onChange={e => setSearch(e.target.value)}
                                    />
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                    {filtered.map((item, idx) => (
                                        <div key={item.id} className="item-card-mobile p-3 sm:p-4 rounded-xl bg-emerald-900/10 border border-emerald-900/20 hover:border-emerald-500/40 hover:bg-emerald-900/20 transition-all duration-200 flex flex-col justify-between group cursor-pointer active:scale-95" style={{animationDelay: `${idx * 30}ms`}} onClick={() => setBillItems([...billItems, {...item, billId: Date.now()}])}>
                                            <div className="flex items-start justify-between mb-2">
                                                <div className="min-w-0 flex-1">
                                                    <div className="font-bold text-sm truncate">{item.name}</div>
                                                    <div className="badge-mobile inline-block mt-1">{item.category}</div>
                                                </div>
                                            </div>
                                            <div className="flex items-center justify-between">
                                                <span className="font-mono text-emerald-400 font-bold text-sm">৳{item.price}</span>
                                                <Button size="sm" variant="secondary" className="h-8 w-8">
                                                    <Icon name="plus" className="w-4 h-4" />
                                                </Button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>

                        <div className="hidden lg:block">
                            <div className="glass-card-mobile p-6 rounded-2xl sticky top-24">
                                <BillContent />
                            </div>
                        </div>
                    </div>

                    {/* Mobile Bill Drawer */}
                    {showBillMobile && (
                        <div className="fixed inset-0 z-50 lg:hidden">
                            <div className="absolute inset-0 bg-black/60 backdrop-blur-sm" onClick={() => setShowBillMobile(false)}></div>
                            <div className="bill-drawer-mobile glass-card-mobile p-5 rounded-t-3xl">
                                <div className="flex justify-between items-center mb-4 pb-4 border-b border-emerald-900/30">
                                    <div className="flex items-center gap-2">
                                        <div className="p-2 bg-emerald-900/40 rounded-lg">
                                            <Icon name="file-text" className="w-5 h-5 text-emerald-400" />
                                        </div>
                                        <h3 className="font-bold">Bill Details</h3>
                                    </div>
                                    <Button size="icon" variant="ghost" onClick={() => setShowBillMobile(false)} className="h-9 w-9">
                                        <Icon name="x" className="w-5 h-5" />
                                    </Button>
                                </div>
                                <div className="flex-1 overflow-y-auto">
                                    <BillContent />
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const Main = () => {
            const [currentPage, setCurrentPage] = useState('home');
            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

            const navItems = [
                { name: 'Home', icon: 'home', page: 'home' },
                { name: 'Outpatient', icon: 'users', page: 'outpatient' },
                { name: 'Inpatient', icon: 'stethoscope', page: 'inpatient' },
                { name: 'Database', icon: 'database', page: 'database' },
            ];

            return (
                <div className="min-h-screen flex flex-col">
                    <header className="header-enhanced text-white sticky top-0 z-40 border-b border-white/10 shadow-xl">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 h-14 sm:h-16 flex items-center justify-between">
                            <div className="flex items-center gap-2 sm:gap-3 cursor-pointer group flex-1 min-w-0" onClick={() => { setCurrentPage('home'); setMobileMenuOpen(false); }}>
                                <div className="bg-white/20 p-1.5 sm:p-2 rounded-lg sm:rounded-xl backdrop-blur-md group-hover:bg-white/30 transition-all flex-shrink-0 border border-white/20">
                                    <Icon name="heart" className="w-5 h-5 sm:w-6 sm:h-6" />
                                </div>
                                <div className="flex flex-col min-w-0">
                                    <span className="text-base sm:text-lg font-black tracking-tight">MCH</span>
                                    <span className="text-[8px] sm:text-[10px] uppercase tracking-[0.12em] text-white/60 font-bold">Hospital</span>
                                </div>
                            </div>
                            
                            <div className="flex items-center gap-1 sm:gap-3 flex-shrink-0">
                                <nav className="hidden md:flex items-center gap-1 bg-white/5 p-1 rounded-xl backdrop-blur-sm border border-white/10 hover:border-white/20 transition-colors">
                                    {navItems.map(item => (
                                        <Button key={item.page} variant="ghost" size="sm" onClick={() => setCurrentPage(item.page)} className={`text-xs sm:text-sm gap-1 sm:gap-2 ${currentPage === item.page ? 'bg-emerald-600/40 text-emerald-300 border-l-2 border-emerald-500' : ''}`}>
                                            <Icon name={item.icon} className="w-4 h-4" />
                                            <span className="hidden lg:inline">{item.name}</span>
                                        </Button>
                                    ))}
                                </nav>
                                <Button variant="secondary" size="icon" className="rounded-lg sm:rounded-xl border border-white/10" onClick={() => setCurrentPage('settings')}>
                                    <Icon name="settings" className="w-4 h-4 sm:w-5 sm:h-5" />
                                </Button>
                                <Button variant="ghost" size="icon" className="md:hidden" onClick={() => setMobileMenuOpen(!mobileMenuOpen)}>
                                    <Icon name={mobileMenuOpen ? "x" : "menu"} className="w-5 h-5" />
                                </Button>
                            </div>
                        </div>

                        {/* Mobile Menu */}
                        {mobileMenuOpen && (
                            <div className="md:hidden border-t border-white/10 bg-black/40 backdrop-blur-md p-2 space-y-1 animate-in fade-in slide-in-from-top-2">
                                {navItems.map((item, idx) => (
                                    <button key={item.page} onClick={() => { setCurrentPage(item.page); setMobileMenuOpen(false); }} className={`mobile-nav-item w-full text-left flex items-center gap-3 ${currentPage === item.page ? 'active bg-emerald-600/30 text-emerald-300' : 'text-white/70 hover:bg-white/10'}`} style={{animation: `slideInRight 0.3s ease-out ${idx * 50}ms both`}}>
                                        <Icon name={item.icon} className="w-5 h-5 flex-shrink-0" />
                                        <span>{item.name}</span>
                                    </button>
                                ))}
                            </div>
                        )}
                    </header>

                    <main className="flex-1 bg-background relative overflow-hidden">
                        {/* Decorative Background Elements */}
                        <div className="absolute top-0 left-1/4 w-96 h-96 bg-emerald-600/5 rounded-full blur-3xl pointer-events-none"></div>
                        <div className="absolute bottom-0 right-0 w-96 h-96 bg-emerald-900/5 rounded-full blur-3xl pointer-events-none"></div>
                        
                        <div className="relative z-10">
                            {currentPage === 'home' && <IndexPage onNavigate={setCurrentPage} />}
                            {currentPage === 'outpatient' && <CalculatorPage type="outpatient" onNavigate={setCurrentPage} />}
                            {currentPage === 'inpatient' && <CalculatorPage type="inpatient" onNavigate={setCurrentPage} />}
                            {currentPage === 'database' && (
                                <div className="max-w-4xl mx-auto py-12 sm:py-20 px-4 sm:px-6">
                                    <div className="glass-card-mobile p-8 sm:p-12 text-center rounded-2xl sm:rounded-3xl" style={{animation: 'floatIn 0.5s ease-out'}}>
                                        <div className="p-4 sm:p-6 bg-emerald-900/30 rounded-2xl w-fit mx-auto mb-4 sm:mb-6">
                                            <Icon name="shield-check" className="w-12 h-12 sm:w-16 sm:h-16 text-emerald-400" />
                                        </div>
                                        <h2 className="text-2xl sm:text-4xl font-bold mb-3 sm:mb-4">Database Management</h2>
                                        <p className="text-sm sm:text-lg text-emerald-100/60 mb-8 sm:mb-10">Configure medical items and pricing.</p>
                                        <Button variant="primary" size="lg" onClick={() => setCurrentPage('home')} className="text-sm sm:text-base">Back to Home</Button>
                                    </div>
                                </div>
                            )}
                            {currentPage === 'settings' && (
                                <div className="max-w-4xl mx-auto py-12 sm:py-20 px-4 sm:px-6">
                                    <div className="glass-card-mobile p-8 sm:p-12 text-center rounded-2xl sm:rounded-3xl" style={{animation: 'floatIn 0.5s ease-out'}}>
                                        <div className="p-4 sm:p-6 bg-emerald-900/30 rounded-2xl w-fit mx-auto mb-4 sm:mb-6">
                                            <Icon name="sliders" className="w-12 h-12 sm:w-16 sm:h-16 text-emerald-400" />
                                        </div>
                                        <h2 className="text-2xl sm:text-4xl font-bold mb-3 sm:mb-4">System Settings</h2>
                                        <p className="text-sm sm:text-lg text-emerald-100/60 mb-8 sm:mb-10">Customize your hospital configuration.</p>
                                        <Button variant="primary" size="lg" onClick={() => setCurrentPage('home')} className="text-sm sm:text-base">Back to Home</Button>
                                    </div>
                                </div>
                            )}
                        </div>
                    </main>

                    <footer className="py-6 sm:py-8 border-t border-emerald-900/20 text-center px-4 sm:px-6 bg-black/10 backdrop-blur-sm">
                        <p className="text-xs sm:text-sm text-emerald-100/40">&copy; 2026 MCH Hospital Billing System</p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Main />);
    </script>
</body>
</html>
