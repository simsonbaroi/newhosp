<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Bill Calculator - Styled Standalone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --background: 220 15% 6%;
            --foreground: 160 20% 95%;
            --card: 220 15% 8%;
            --card-foreground: 160 20% 95%;
            --primary: 160 60% 45%;
            --primary-foreground: 0 0% 100%;
            --secondary: 160 25% 15%;
            --secondary-foreground: 160 20% 85%;
            --muted: 220 15% 12%;
            --muted-foreground: 160 10% 65%;
            --accent: 160 60% 35%;
            --accent-foreground: 0 0% 100%;
            --border: 160 25% 20%;
            --input: 220 15% 10%;
            --ring: 160 60% 45%;
            --medical-primary: 160 60% 45%;
            --medical-gradient-start: 160 60% 30%;
            --medical-gradient-end: 160 65% 45%;
        }

        body {
            background-color: hsl(220, 15%, 6%);
            color: hsl(160, 20%, 95%);
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        .header-enhanced {
            background: linear-gradient(135deg, hsl(160, 60%, 30%), hsl(160, 65%, 45%));
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .nav-button-enhanced {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .nav-button-enhanced:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.25);
        }

        .nav-button-active {
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.4);
            transform: translateY(-2px);
            background-color: rgba(255, 255, 255, 0.25);
        }

        .glass-card {
            background: rgba(22, 25, 31, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid hsl(160, 25%, 20%);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), 
                        0 4px 16px rgba(77, 166, 122, 0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            box-shadow: 0 16px 64px rgba(0, 0, 0, 0.5), 
                        0 8px 32px rgba(77, 166, 122, 0.15);
            border-color: rgba(16, 185, 129, 0.3);
            transform: translateY(-2px);
        }

        .medical-gradient {
            background: linear-gradient(135deg, hsl(160, 60%, 30%), hsl(160, 65%, 45%));
        }

        .neo-shadow {
            box-shadow: 
                0 0 0 1px rgba(160, 237, 193, 0.05),
                0 4px 16px rgba(0, 0, 0, 0.2),
                0 8px 32px rgba(0, 0, 0, 0.15);
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: hsl(220, 15%, 6%);
        }
        ::-webkit-scrollbar-thumb {
            background: hsl(160, 25%, 20%);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: hsl(160, 60%, 45%);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- Mock Data ---
        const MEDICAL_ITEMS = [
            { id: 1, category: 'Laboratory', name: 'Complete Blood Count', price: 250, isOutpatient: true },
            { id: 2, category: 'Laboratory', name: 'Urinalysis', price: 150, isOutpatient: true },
            { id: 3, category: 'X-Ray', name: 'Chest X-Ray', price: 800, isOutpatient: true },
            { id: 4, category: 'Dr. Fees', name: 'General Consultation', price: 500, isOutpatient: true },
            { id: 5, category: 'Laboratory', name: 'Blood Chemistry', price: 500, isOutpatient: false },
            { id: 6, category: 'Surgery', name: 'Minor Surgery', price: 15000, isOutpatient: false },
            { id: 7, category: 'Registration Fees', name: 'Outpatient Registration', price: 100, isOutpatient: true },
            { id: 8, category: 'Registration Fees', name: 'Admission Fee', price: 500, isOutpatient: false },
        ];

        // --- Shared Components ---
        const Icon = ({ name, className }) => {
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, []);
            return <i data-lucide={name} className={className}></i>;
        };

        const Button = ({ children, variant = 'primary', className = '', onClick, size = 'default' }) => {
            const sizes = {
                default: "h-10 px-4 py-2",
                sm: "h-9 px-3 rounded-md",
                lg: "h-11 px-8 rounded-md",
                icon: "h-10 w-10"
            };
            const variants = {
                primary: "bg-emerald-600 hover:bg-emerald-500 text-white shadow-lg",
                outline: "border border-emerald-600/50 text-emerald-500 hover:bg-emerald-600/10",
                ghost: "hover:bg-white/10 text-white",
                medical: "bg-white text-emerald-800 hover:bg-emerald-50 shadow-xl",
                secondary: "bg-emerald-900/30 text-emerald-100 hover:bg-emerald-900/50"
            };
            return (
                <button 
                    className={`inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-md text-sm font-medium transition-colors focus-visible:outline-none disabled:pointer-events-none disabled:opacity-50 ${sizes[size]} ${variants[variant]} ${className}`} 
                    onClick={onClick}
                >
                    {children}
                </button>
            );
        };

        // --- Pages ---
        const IndexPage = ({ onNavigate }) => (
            <div className="min-h-screen">
                <div className="medical-gradient text-white py-20 px-6">
                    <div className="max-w-5xl mx-auto text-center">
                        <div className="flex justify-center mb-8">
                            <div className="p-5 bg-white/20 rounded-full backdrop-blur-md">
                                <Icon name="heart" className="w-16 h-16 text-white" />
                            </div>
                        </div>
                        <h1 className="text-5xl font-bold mb-6 tracking-tight">Hospital Bill Calculator</h1>
                        <p className="text-xl text-emerald-50/90 mb-10 max-w-2xl mx-auto leading-relaxed">
                            Professional medical billing system with high-fidelity glass morphism design. 
                            Manage hospital finances with precision and modern UI aesthetics.
                        </p>
                        <Button variant="medical" size="lg" onClick={() => onNavigate('outpatient')} className="font-bold text-lg">
                            Start Calculating <Icon name="arrow-right" className="w-5 h-5 ml-2" />
                        </Button>
                    </div>
                </div>

                <div className="max-w-7xl mx-auto px-6 py-20 grid md:grid-cols-3 gap-8">
                    <div className="glass-card p-8 group cursor-pointer" onClick={() => onNavigate('outpatient')}>
                        <div className="mb-6 p-4 bg-emerald-900/30 rounded-2xl w-fit group-hover:scale-110 transition-transform">
                            <Icon name="users" className="w-10 h-10 text-emerald-400" />
                        </div>
                        <h3 className="text-2xl font-bold mb-4">Outpatient</h3>
                        <p className="text-emerald-100/60 mb-8 leading-relaxed">Calculate bills for lab tests, x-rays, and daily medical consultations.</p>
                        <Button variant="primary" className="w-full">Open Calculator</Button>
                    </div>
                    <div className="glass-card p-8 group cursor-pointer" onClick={() => onNavigate('inpatient')}>
                        <div className="mb-6 p-4 bg-emerald-900/30 rounded-2xl w-fit group-hover:scale-110 transition-transform">
                            <Icon name="stethoscope" className="w-10 h-10 text-emerald-400" />
                        </div>
                        <h3 className="text-2xl font-bold mb-4">Inpatient</h3>
                        <p className="text-emerald-100/60 mb-8 leading-relaxed">Manage admission fees, room charges, and surgical procedures.</p>
                        <Button variant="primary" className="w-full">Open Calculator</Button>
                    </div>
                    <div className="glass-card p-8 group cursor-pointer" onClick={() => onNavigate('database')}>
                        <div className="mb-6 p-4 bg-emerald-900/30 rounded-2xl w-fit group-hover:scale-110 transition-transform">
                            <Icon name="database" className="w-10 h-10 text-emerald-400" />
                        </div>
                        <h3 className="text-2xl font-bold mb-4">Database</h3>
                        <p className="text-emerald-100/60 mb-8 leading-relaxed">Configure medical item pricing and customize hospital categories.</p>
                        <Button variant="outline" className="w-full">Manage Data</Button>
                    </div>
                </div>
            </div>
        );

        const CalculatorPage = ({ type, onNavigate }) => {
            const [billItems, setBillItems] = useState([]);
            const [search, setSearch] = useState('');

            const filtered = MEDICAL_ITEMS.filter(i => 
                (type === 'outpatient' ? i.isOutpatient : !i.isOutpatient) &&
                i.name.toLowerCase().includes(search.toLowerCase())
            );

            const total = billItems.reduce((acc, i) => acc + i.price, 0);

            return (
                <div className="max-w-7xl mx-auto px-6 py-10 grid lg:grid-cols-3 gap-10">
                    <div className="lg:col-span-2 space-y-8">
                        <div className="flex items-center justify-between">
                            <h2 className="text-3xl font-bold flex items-center gap-3">
                                <Icon name={type === 'outpatient' ? 'users' : 'stethoscope'} className="w-8 h-8 text-emerald-500" />
                                {type.charAt(0).toUpperCase() + type.slice(1)} Billing
                            </h2>
                        </div>

                        <div className="glass-card p-6">
                            <div className="relative mb-8">
                                <Icon name="search" className="absolute left-4 top-3.5 text-emerald-500/50 w-5 h-5" />
                                <input 
                                    className="w-full bg-black/40 border border-emerald-900/50 rounded-xl py-3 pl-12 pr-4 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition-all placeholder:text-emerald-900/50"
                                    placeholder={`Search for ${type} medical items...`}
                                    value={search}
                                    onChange={e => setSearch(e.target.value)}
                                />
                            </div>

                            <div className="grid sm:grid-cols-2 gap-4">
                                {filtered.map(item => (
                                    <div key={item.id} className="p-4 rounded-xl bg-emerald-900/10 border border-emerald-900/20 hover:border-emerald-500/40 transition-all flex justify-between items-center group">
                                        <div>
                                            <div className="font-bold text-lg">{item.name}</div>
                                            <div className="text-xs uppercase tracking-wider text-emerald-500/70 font-semibold">{item.category}</div>
                                        </div>
                                        <div className="flex items-center gap-4">
                                            <div className="font-mono text-emerald-400 font-bold">৳{item.price}</div>
                                            <Button size="sm" variant="secondary" onClick={() => setBillItems([...billItems, {...item, billId: Date.now()}])}>
                                                <Icon name="plus" className="w-4 h-4" />
                                            </Button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>

                    <div className="space-y-8">
                        <div className="glass-card p-6 sticky top-24">
                            <div className="flex items-center gap-2 mb-6 border-b border-emerald-900/30 pb-4">
                                <Icon name="file-text" className="w-5 h-5 text-emerald-500" />
                                <h3 className="text-xl font-bold">Current Bill</h3>
                            </div>
                            
                            <div className="space-y-3 mb-8 max-h-[400px] overflow-y-auto pr-2 custom-scrollbar">
                                {billItems.map(item => (
                                    <div key={item.billId} className="flex justify-between items-center group bg-white/5 p-3 rounded-lg border border-transparent hover:border-red-500/30 transition-all">
                                        <span className="text-sm font-medium">{item.name}</span>
                                        <div className="flex items-center gap-3">
                                            <span className="text-emerald-400 font-mono font-bold">৳{item.price}</span>
                                            <button 
                                                onClick={() => setBillItems(billItems.filter(i => i.billId !== item.billId))}
                                                className="text-red-500/50 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity"
                                            >
                                                <Icon name="x" className="w-4 h-4" />
                                            </button>
                                        </div>
                                    </div>
                                ))}
                                {billItems.length === 0 && (
                                    <div className="py-10 text-center flex flex-col items-center gap-3 opacity-20">
                                        <Icon name="shopping-cart" className="w-12 h-12" />
                                        <p className="font-medium">No items in bill</p>
                                    </div>
                                )}
                            </div>

                            <div className="space-y-4 pt-6 border-t border-emerald-900/50">
                                <div className="flex justify-between items-center">
                                    <span className="text-emerald-100/50 font-medium">Subtotal</span>
                                    <span className="font-mono">৳{total}</span>
                                </div>
                                <div className="flex justify-between items-center text-2xl font-bold text-emerald-400">
                                    <span>Total Amount</span>
                                    <span className="font-mono">৳{total}</span>
                                </div>
                                <Button variant="primary" className="w-full h-12 text-lg shadow-xl neo-shadow" onClick={() => alert('Invoice generated!')}>
                                    Print Invoice <Icon name="printer" className="w-5 h-5 ml-2" />
                                </Button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const Main = () => {
            const [currentPage, setCurrentPage] = useState('home');

            return (
                <div className="min-h-screen flex flex-col">
                    <header className="header-enhanced text-white sticky top-0 z-50 border-b border-white/10 shadow-xl">
                        <div className="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
                            <div className="flex items-center gap-3 cursor-pointer group" onClick={() => setCurrentPage('home')}>
                                <div className="bg-white/20 p-2 rounded-xl backdrop-blur-md group-hover:bg-white/30 transition-all">
                                    <Icon name="calculator" className="w-6 h-6" />
                                </div>
                                <div className="flex flex-col">
                                    <span className="text-xl font-black tracking-tighter">MCH SYSTEM</span>
                                    <span className="text-[10px] uppercase tracking-[0.2em] text-white/60 -mt-1 font-bold">Billing Dept</span>
                                </div>
                            </div>
                            
                            <div className="flex items-center gap-2">
                                <nav className="hidden md:flex items-center gap-1 bg-black/20 p-1 rounded-xl backdrop-blur-sm border border-white/5 mr-4">
                                    <Button variant="ghost" size="sm" onClick={() => setCurrentPage('home')} className={currentPage === 'home' ? 'bg-white/10' : ''}>Home</Button>
                                    <Button variant="ghost" size="sm" onClick={() => setCurrentPage('outpatient')} className={currentPage === 'outpatient' ? 'bg-white/10' : ''}>Outpatient</Button>
                                    <Button variant="ghost" size="sm" onClick={() => setCurrentPage('inpatient')} className={currentPage === 'inpatient' ? 'bg-white/10' : ''}>Inpatient</Button>
                                    <Button variant="ghost" size="sm" onClick={() => setCurrentPage('database')} className={currentPage === 'database' ? 'bg-white/10' : ''}>Database</Button>
                                </nav>
                                <Button variant="secondary" size="icon" className="rounded-xl border border-white/10" onClick={() => setCurrentPage('settings')}>
                                    <Icon name="settings" className="w-5 h-5" />
                                </Button>
                            </div>
                        </div>
                    </header>

                    <main className="flex-1 bg-background relative overflow-hidden">
                        {/* Decorative Background Elements */}
                        <div className="absolute top-[-10%] -left-[-10%] w-[500px] h-[500px] bg-emerald-600/10 rounded-full blur-[120px] pointer-events-none"></div>
                        <div className="absolute bottom-[-10%] -right-[-10%] w-[500px] h-[500px] bg-emerald-900/10 rounded-full blur-[120px] pointer-events-none"></div>
                        
                        <div className="relative z-10">
                            {currentPage === 'home' && <IndexPage onNavigate={setCurrentPage} />}
                            {currentPage === 'outpatient' && <CalculatorPage type="outpatient" onNavigate={setCurrentPage} />}
                            {currentPage === 'inpatient' && <CalculatorPage type="inpatient" onNavigate={setCurrentPage} />}
                            {currentPage === 'database' && (
                                <div className="max-w-4xl mx-auto py-20 px-6">
                                    <div className="glass-card p-12 text-center">
                                        <Icon name="shield-check" className="w-20 h-20 text-emerald-500 mx-auto mb-6" />
                                        <h2 className="text-4xl font-bold mb-4 tracking-tight">Database Management</h2>
                                        <p className="text-xl text-emerald-100/50 mb-10">Protected administrator interface for hospital configuration.</p>
                                        <Button variant="primary" size="lg" onClick={() => setCurrentPage('home')}>Back to Home</Button>
                                    </div>
                                </div>
                            )}
                            {currentPage === 'settings' && (
                                <div className="max-w-4xl mx-auto py-20 px-6">
                                    <div className="glass-card p-12 text-center">
                                        <Icon name="settings" className="w-20 h-20 text-emerald-500 mx-auto mb-6" />
                                        <h2 className="text-4xl font-bold mb-4 tracking-tight">System Settings</h2>
                                        <p className="text-xl text-emerald-100/50 mb-10">Configure branding, currency, and visual identity.</p>
                                        <Button variant="primary" size="lg" onClick={() => setCurrentPage('home')}>Back to Home</Button>
                                    </div>
                                </div>
                            )}
                        </div>
                    </main>

                    <footer className="py-10 border-t border-emerald-900/20 text-center px-6">
                        <div className="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-6 text-sm text-emerald-100/30">
                            <p>&copy; 2026 MCH Hospital Billing. All Systems Healthy.</p>
                            <div className="flex gap-8">
                                <a href="#" className="hover:text-emerald-400 transition-colors">Privacy</a>
                                <a href="#" className="hover:text-emerald-400 transition-colors">Security</a>
                                <a href="#" className="hover:text-emerald-400 transition-colors">Support</a>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Main />);
    </script>
</body>
</html>
